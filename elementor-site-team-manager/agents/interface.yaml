interface:
  display_name: "Elementor Site Team Manager"
  short_description: "协调方向稿、HTML 分层评审与 Elementor Widget 实现"
  default_prompt: "Use $elementor-site-team-manager as the single entry point. Classify review level as none, standard, or enhanced; require direction critique when images are used and one-pass blind HTML review for every designed page. After HTML, implement explicit user-directed changes directly; for vague discomfort, ask before dispatching a fresh diagnostic subagent."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    uncertain_confirmation: "Treat files as evidence, not proof of user approval; ask only for the unresolved gate."
    missing_specialist: "Disclose the unavailable specialist and stop at the current stage rather than improvising its rules."
    out_of_scope: "Explain the boundary and recommend an external workflow without adding it to the managed nine-skill process."
