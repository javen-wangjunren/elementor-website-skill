interface:
  display_name: "Elementor Site Team Manager"
  short_description: "协调新老站设计系统、Elementor 样式契约与 Widget 实现"
  default_prompt: "Use $elementor-site-team-manager as the single entry point. Determine the site mode and style authority, coordinate content and the Design System, map it through the Elementor Site Style Adapter when implementation requires inheritance, then route confirmed design and one Widget at a time."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    uncertain_confirmation: "Treat files as evidence, not proof of user approval; ask only for the unresolved gate."
    missing_specialist: "Disclose the unavailable specialist and stop at the current stage rather than improvising its rules."
    out_of_scope: "Explain the boundary and recommend an external workflow without adding it to the managed eight-skill process."
