interface:
  display_name: "Elementor Site Team Manager"
  short_description: "协调页面内容、设计系统、整页或模块设计与 Elementor Widget 实现"
  default_prompt: "Use $elementor-site-team-manager as the single entry point for this custom Elementor Widget site task. Infer the current stage, coordinate content and the Design System, route visual design to Website UI Architect, confirmed design to Website HTML Prototyper, and one confirmed HTML Section at a time to the Widget Pipeline."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    uncertain_confirmation: "Treat files as evidence, not proof of user approval; ask only for the unresolved gate."
    missing_specialist: "Disclose the unavailable specialist and stop at the current stage rather than improvising its rules."
    out_of_scope: "Explain the boundary and recommend an external workflow without adding it to the managed six-skill process."
