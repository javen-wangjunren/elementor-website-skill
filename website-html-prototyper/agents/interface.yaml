interface:
  display_name: "Website HTML Prototyper"
  short_description: "细化 HTML，并对每个设计页面完成分层独立评审"
  default_prompt: "Use $website-html-prototyper to implement confirmed page/module plans, refine desktop/mobile rendering, and after Browser QA run a one-pass blind review for every designed page. When later user feedback is vague, ask whether they want a fresh subagent to diagnose the affected module; when the requested change is explicit, implement it directly without forcing another review."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    missing_visual_direction: "If major module decisions are unresolved, route to website-ui-architect to settle them; missing or unrefined images alone do not block HTML refinement."
    missing_design_system: "Route to website-design-system-architect; do not invent replacement visual tokens."
    missing_page_content: "For full pages, route to website-page-content-architect; a confirmed single-module brief may continue."
