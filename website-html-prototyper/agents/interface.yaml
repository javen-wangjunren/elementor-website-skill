interface:
  display_name: "Website HTML Prototyper"
  short_description: "保留确认的模块方案，主动细化整页或模块 HTML 视觉并完成浏览器验证"
  default_prompt: "Use $website-html-prototyper to turn confirmed module plans and optional rough directions into visually refined page or module HTML, preserve locked design decisions, and validate actual desktop/mobile rendering and interactions."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    missing_visual_direction: "If major module decisions are unresolved, route to website-ui-architect to settle them; missing or unrefined images alone do not block HTML refinement."
    missing_design_system: "Route to website-design-system-architect; do not invent replacement visual tokens."
    missing_page_content: "For full pages, route to website-page-content-architect; a confirmed single-module brief may continue."
