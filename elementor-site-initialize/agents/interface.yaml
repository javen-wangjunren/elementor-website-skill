interface:
  display_name: "Elementor Site Initialize"
  short_description: "初始化 Elementor 插件骨架与新站或老站样式上下文"
  default_prompt: "Use $elementor-site-initialize in the current project workspace. Confirm the plugin path, Flat or Grouped structure, site mode, and style authority; create the local scaffold with a pending site-style context without modifying WordPress or mapping Site Settings."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    missing_theme: "Continue with confirmed project and plugin naming; set theme evidence to unavailable and do not invent theme facts."
