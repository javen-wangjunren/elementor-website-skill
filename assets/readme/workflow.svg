<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">像盖房一样完成一个 Elementor 网站</title>
  <desc id="desc">先核实公司资料和参考证据，再规划页面大纲、视觉规范和施工图，最后制作浏览器样板与 Elementor 组件。</desc>
  <rect width="1200" height="500" rx="28" fill="#f4f7f6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="56" y="70" fill="#17242c" font-size="44" font-weight="800">像盖房一样，把网站一层层做扎实</text>
    <text x="56" y="108" fill="#56646b" font-size="23">先勘察地基，再画图定方案，最后打样、施工和验收。</text>
  </g>
  <g stroke="#98a8ae" stroke-width="4" fill="none">
    <path d="M394 282H446"/>
    <path d="M754 282H806"/>
  </g>
  <g fill="#98a8ae">
    <path d="M446 282l-14-9v18z"/><path d="M806 282l-14-9v18z"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(54 158)">
      <rect width="340" height="200" rx="20" fill="#ffffff" stroke="#cad3d6" stroke-width="2"/>
      <text x="28" y="42" fill="#0b83b8" font-size="21" font-weight="800" letter-spacing="2">01 · 勘察</text>
      <text x="28" y="88" fill="#17242c" font-size="30" font-weight="800">先核实地基与材料</text>
      <text x="28" y="128" fill="#56646b" font-size="21">公司资料 · 参考网站</text>
      <text x="28" y="158" fill="#56646b" font-size="21">真实能力、素材与边界</text>
    </g>
    <g transform="translate(446 158)">
      <rect width="308" height="200" rx="20" fill="#17242c"/>
      <text x="28" y="42" fill="#5ac0e8" font-size="21" font-weight="800" letter-spacing="2">02 · 画图</text>
      <text x="28" y="88" fill="#ffffff" font-size="30" font-weight="800">再定大纲与视觉</text>
      <text x="28" y="128" fill="#c7d0d4" font-size="21">页面动线 · 装修规范</text>
      <text x="28" y="158" fill="#f2bd27" font-size="21" font-weight="700">施工图与效果图</text>
    </g>
    <g transform="translate(806 158)">
      <rect width="340" height="200" rx="20" fill="#ffffff" stroke="#cad3d6" stroke-width="2"/>
      <text x="28" y="42" fill="#0b83b8" font-size="21" font-weight="800" letter-spacing="2">03 · 施工</text>
      <text x="28" y="88" fill="#17242c" font-size="30" font-weight="800">最后打样与实现</text>
      <text x="28" y="128" fill="#56646b" font-size="21">浏览器样板间 · Elementor</text>
      <text x="28" y="158" fill="#56646b" font-size="21">组件制作与真实验收</text>
    </g>
    <g transform="translate(56 431)">
      <circle cx="10" cy="0" r="8" fill="#f2bd27"/>
      <text x="32" y="8" fill="#56646b" font-size="21">黄色标记代表需要你确认的方案；有文件不等于已经通过验收。</text>
    </g>
  </g>
</svg>
