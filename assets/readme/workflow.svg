<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">从真实资料到 Elementor Widget 的完整流程</title>
  <desc id="desc">先核实资料并规划内容，再制定视觉方案和独立复核方向稿，然后制作与复核 HTML 样板，最后实现 Elementor Widget 并在真实页面验收。</desc>
  <rect width="1200" height="720" rx="28" fill="#f4f7f6"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="56" y="64" fill="#17242c" font-size="40" font-weight="800">从真实资料，到可维护的 Elementor Widget</text>
    <text x="56" y="101" fill="#56646b" font-size="22">每一层先确认，再进入下一层；方向稿与真实 HTML 分开复核。</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(54 132)">
      <rect width="1092" height="118" rx="20" fill="#ffffff" stroke="#cad3d6" stroke-width="2"/>
      <text x="28" y="48" fill="#0b83b8" font-size="22" font-weight="800">01</text>
      <text x="112" y="48" fill="#17242c" font-size="28" font-weight="800">资料与内容</text>
      <text x="112" y="84" fill="#56646b" font-size="20">核实公司事实与素材，确认页面目标、内容顺序和信任证据</text>
    </g>
    <g transform="translate(54 270)">
      <rect width="1092" height="118" rx="20" fill="#17242c"/>
      <text x="28" y="48" fill="#5ac0e8" font-size="22" font-weight="800">02</text>
      <text x="112" y="48" fill="#ffffff" font-size="28" font-weight="800">视觉方案</text>
      <text x="112" y="84" fill="#c7d0d4" font-size="20">制定设计系统与页面施工图；方向稿只确定布局、主次与气质</text>
      <rect x="870" y="43" width="174" height="34" rx="17" fill="#f2bd27"/>
      <text x="957" y="67" text-anchor="middle" fill="#17242c" font-size="18" font-weight="800">独立方向复核</text>
    </g>
    <g transform="translate(54 408)">
      <rect width="1092" height="118" rx="20" fill="#ffffff" stroke="#cad3d6" stroke-width="2"/>
      <text x="28" y="48" fill="#0b83b8" font-size="22" font-weight="800">03</text>
      <text x="112" y="48" fill="#17242c" font-size="28" font-weight="800">HTML 样板</text>
      <text x="112" y="84" fill="#56646b" font-size="20">在真实浏览器检查电脑、手机、交互、动效和响应式表现</text>
      <rect x="870" y="43" width="174" height="34" rx="17" fill="#f2bd27"/>
      <text x="957" y="67" text-anchor="middle" fill="#17242c" font-size="18" font-weight="800">独立视觉复核</text>
    </g>
    <g transform="translate(54 546)">
      <rect width="1092" height="118" rx="20" fill="#ffffff" stroke="#cad3d6" stroke-width="2"/>
      <text x="28" y="48" fill="#0b83b8" font-size="22" font-weight="800">04</text>
      <text x="112" y="48" fill="#17242c" font-size="28" font-weight="800">Widget 落地</text>
      <text x="112" y="84" fill="#56646b" font-size="20">一次实现一个模块，只开放必要字段，最后在真实 Elementor 页面组装验收</text>
    </g>
  </g>

  <g stroke="#98a8ae" stroke-width="4" fill="#98a8ae">
    <path d="M90 250V270"/><path d="M90 270l-8-13h16z"/>
    <path d="M90 388V408"/><path d="M90 408l-8-13h16z"/>
    <path d="M90 526V546"/><path d="M90 546l-8-13h16z"/>
  </g>
</svg>
