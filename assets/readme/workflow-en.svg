<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From verified business material to maintainable Elementor Widgets</title>
  <desc id="desc">Verify facts and plan content, define and independently review the visual direction, build and review an HTML prototype, then implement Elementor Widgets and validate them on a real page.</desc>
  <rect width="1200" height="720" rx="28" fill="#f4f7f6"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="64" fill="#17242c" font-size="40" font-weight="800">A four-stage path to maintainable Elementor Widgets</text>
    <text x="56" y="101" fill="#56646b" font-size="22">Approve each layer before the next; review visual directions and real HTML separately.</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(54 132)">
      <rect width="1092" height="118" rx="20" fill="#ffffff" stroke="#cad3d6" stroke-width="2"/>
      <text x="28" y="48" fill="#0b83b8" font-size="22" font-weight="800">01</text>
      <text x="112" y="48" fill="#17242c" font-size="28" font-weight="800">Facts &amp; content</text>
      <text x="112" y="84" fill="#56646b" font-size="20">Verify company facts and assets; confirm page goals, content order, and evidence</text>
    </g>
    <g transform="translate(54 270)">
      <rect width="1092" height="118" rx="20" fill="#17242c"/>
      <text x="28" y="48" fill="#5ac0e8" font-size="22" font-weight="800">02</text>
      <text x="112" y="48" fill="#ffffff" font-size="28" font-weight="800">Visual direction</text>
      <text x="112" y="84" fill="#c7d0d4" font-size="20">Define the system and blueprint; direction sets layout and tone</text>
      <rect x="844" y="43" width="200" height="34" rx="17" fill="#f2bd27"/>
      <text x="944" y="67" text-anchor="middle" fill="#17242c" font-size="17" font-weight="800">INDEPENDENT REVIEW</text>
    </g>
    <g transform="translate(54 408)">
      <rect width="1092" height="118" rx="20" fill="#ffffff" stroke="#cad3d6" stroke-width="2"/>
      <text x="28" y="48" fill="#0b83b8" font-size="22" font-weight="800">03</text>
      <text x="112" y="48" fill="#17242c" font-size="28" font-weight="800">HTML prototype</text>
      <text x="112" y="84" fill="#56646b" font-size="20">Validate desktop, mobile, interaction, motion, and responsive behavior</text>
      <rect x="844" y="43" width="200" height="34" rx="17" fill="#f2bd27"/>
      <text x="944" y="67" text-anchor="middle" fill="#17242c" font-size="17" font-weight="800">INDEPENDENT REVIEW</text>
    </g>
    <g transform="translate(54 546)">
      <rect width="1092" height="118" rx="20" fill="#ffffff" stroke="#cad3d6" stroke-width="2"/>
      <text x="28" y="48" fill="#0b83b8" font-size="22" font-weight="800">04</text>
      <text x="112" y="48" fill="#17242c" font-size="28" font-weight="800">Widget delivery</text>
      <text x="112" y="84" fill="#56646b" font-size="20">Implement one module at a time, then assemble and verify it in real Elementor</text>
    </g>
  </g>

  <g stroke="#98a8ae" stroke-width="4" fill="#98a8ae">
    <path d="M90 250V270"/><path d="M90 270l-8-13h16z"/>
    <path d="M90 388V408"/><path d="M90 408l-8-13h16z"/>
    <path d="M90 526V546"/><path d="M90 546l-8-13h16z"/>
  </g>
</svg>
