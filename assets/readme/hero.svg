      <text x="58" y="31" fill="#f7f8f6" font-size="24" font-weight="800">02 · 页面与模块设计</text>
      <text x="58" y="57" fill="#b8c2c7" font-size="20">先确认，再进入真实 HTML</text>
    </g>
