      <text x="24" y="31" fill="#f7f8f6" font-size="20" font-weight="700">为可信 B2B 企业站而设计</text>
    </g>
  </g>
  <g transform="translate(766 58)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="20" fill="#9eabb1" font-size="20" font-weight="800" letter-spacing="2">WHAT YOU GET</text>
    <g transform="translate(0 48)">
      <rect width="376" height="76" rx="14" fill="#22343e" stroke="#3b4d56"/>
      <circle cx="29" cy="38" r="12" fill="#5ac0e8"/>
      <text x="58" y="31" fill="#f7f8f6" font-size="24" font-weight="800">01 · 真实业务与证据</text>
      <text x="58" y="57" fill="#b8c2c7" font-size="20">让客户先理解，也先信任</text>
    </g>
    <g transform="translate(0 138)">
