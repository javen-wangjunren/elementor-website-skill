      <rect width="376" height="76" rx="14" fill="#22343e" stroke="#3b4d56"/>
      <circle cx="29" cy="38" r="12" fill="#5ac0e8"/>
      <text x="58" y="31" fill="#f7f8f6" font-size="24" font-weight="800">03 · Elementor Widget</text>
      <text x="58" y="57" fill="#b8c2c7" font-size="20">高还原、可编辑、可维护</text>
