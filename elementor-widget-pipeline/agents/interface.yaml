interface:
  display_name: "Elementor Widget Pipeline"
  short_description: "从确认 HTML 或简单强参考，以最少字段实现单个 Elementor Widget"
  default_prompt: "Use $elementor-widget-pipeline to implement one Widget from confirmed HTML, or use its controlled Simple Reference-led Fast Path for one unambiguous module in an existing Elementor page. Confirm the source mode, conservative field card, reference interpretation when applicable, and canonical slug before implementation."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    missing_html: "Use the Simple Reference-led Fast Path only when all eligibility rules pass and the user explicitly approves it; otherwise route confirmed design to website-html-prototyper or unresolved design to website-ui-architect."
    missing_plugin: "Stop Widget implementation and route to elementor-site-initialize; resume only after the plugin scaffold and Flat or Grouped structure are confirmed."
