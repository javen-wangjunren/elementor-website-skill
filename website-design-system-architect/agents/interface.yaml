interface:
  display_name: "Website Design System Architect"
  short_description: "建立新站基线或提炼老站真实视觉系统"
  default_prompt: "Use $website-design-system-architect to establish a new-site baseline or extract an existing site's rendered visual system, confirm one direction and Design Board, and record the site mode and style-authority intent without inventing Elementor mappings."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    missing_advisors: "Disclose skipped advisors and continue with project evidence, industry research, and built-in review criteria."
    unavailable_web_research: "Ask for representative references or proceed with clearly labeled hypotheses; do not present them as current industry evidence."
