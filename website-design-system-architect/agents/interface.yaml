interface:
  display_name: "Website Design System Architect"
  short_description: "建立有企业辨识度、视觉预算与运动性格的设计系统"
  default_prompt: "Use $website-design-system-architect to establish or extract a platform-neutral design system with evidence-based Visual Identity Drivers, a restrained Visual Budget, complete component states, and a Motion Character. Validate one selected direction with a Design Board without deciding page layouts or Elementor mappings."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    missing_advisors: "Disclose skipped advisors and continue with project evidence, industry research, and built-in review criteria."
    unavailable_web_research: "Ask for representative references or proceed with clearly labeled hypotheses; do not present them as current industry evidence."
