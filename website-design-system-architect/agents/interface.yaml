interface:
  display_name: "Website Design System Architect"
  short_description: "为新站或老站建立跨技术栈的网站设计系统"
  default_prompt: "Use $website-design-system-architect to research or extract the visual direction, confirm one text direction, validate it with one Design Board, and then establish an evolving Active Baseline Design System."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    missing_advisors: "Disclose skipped advisors and continue with project evidence, industry research, and built-in review criteria."
    unavailable_web_research: "Ask for representative references or proceed with clearly labeled hypotheses; do not present them as current industry evidence."
