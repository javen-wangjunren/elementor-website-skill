interface:
  display_name: "Website UI Architect"
  short_description: "确认页面方案，并在方向稿进入 HTML 前独立评审"
  default_prompt: "Use $website-ui-architect to turn confirmed content and a Design System into page/module plans. For enhanced-review work, derive a business-specific concept and whole-page throughline. Whenever direction images are generated or used, send the completed scope to one fresh subagent for independent critique before HTML; skip this when no image exists."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    missing_advisors: "Disclose skipped advisors and continue with the approved Design System, project evidence, and built-in review criteria."
    missing_design_system: "Stop module design and route the task to website-design-system-architect; do not invent replacement visual rules."
    missing_page_content: "For full-page work, stop visual design and route to website-page-content-architect; a clear single-module brief may continue without a page framework file."
